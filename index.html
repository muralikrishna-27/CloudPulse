<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CloudPulse - Weather Dashboard</title>
    <link rel="icon" href="weather.png">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- Search Bar -->
    <header class="searchBar">
        <div class="searchBarParentDiv">
            <input type="text" class="inputfield" placeholder="Search City (e.g. Hyderabad, Mumbai, Delhi, London)..." id="cityInput" onkeypress="handleKeyPress(event)" autocomplete="off">
            <img src="./search.png" alt="Search Icon" width="32px" class="searchIcon" onclick="fetchData()" title="Search">
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="mainContentParentDiv">
        <!-- Left Side: Current Weather & 5-Day Forecast -->
        <section class="leftDiv">
            <div class="currentTempDiv leftChild p-3 d-flex flex-column gap-2">
                <div class="d-flex justify-content-between align-items-center">
                    <h6 class="m-0 fw-bold" id="cityName">Hyderabad, IN</h6>
                    <img id="currentWeatherIcon" src="./weather.png" alt="Weather condition" width="55px">
                </div>
                <h5 class="m-0 display-temp"><span id="cityTemp">--</span> &deg;C</h5>
                <h6 class="m-0 text-capitalize" id="cityDesc">--</h6>
                <hr class="line my-2">
                <div class="d-flex gap-2 align-items-center">
                    <img src="./calendar.png" alt="Calendar" width="22px">
                    <h6 class="m-0" id="datecrct">YYYY/MM/DD</h6>
                </div>
                <div class="d-flex gap-2 align-items-center">
                    <img src="./time.png" alt="Clock" width="22px">
                    <h6 class="m-0" id="timecrct">-:-- --</h6>
                </div>
            </div>

            <div class="nextFiveDays leftChild p-3 d-flex flex-column gap-2">
                <h6 class="m-0 fw-bold" id="comingFiveDaysTitle">Coming 5 Days</h6>
                <div id="forecastContainer" class="d-flex flex-column gap-2"></div>
            </div>
        </section>

        <!-- Right Side: Weather Metrics, Air Quality, Sun Times, and Hourly Forecast -->
        <section class="rightDiv">
            <!-- Row 1: Weather Metrics -->
            <div class="rightRow rowOne">
                <div class="extraMetric">
                    <img src="./flood.png" alt="Humidity" width="35px">
                    <div>
                        <h6 class="metric-title m-0">Humidity</h6>
                        <h6 class="metric-val m-0" id="humidity">- %</h6>
                    </div>
                </div>
                <div class="extraMetric">
                    <img src="./wind (1).png" alt="Pressure" width="35px">
                    <div>
                        <h6 class="metric-title m-0">Pressure</h6>
                        <h6 class="metric-val m-0" id="pressure">- hPa</h6>
                    </div>
                </div>
                <div class="extraMetric">
                    <img src="./hot.png" alt="Feels Like" width="35px">
                    <div>
                        <h6 class="metric-title m-0">Feels Like</h6>
                        <h6 class="metric-val m-0" id="feels_like">- &deg;C</h6>
                    </div>
                </div>
                <div class="extraMetric">
                    <img src="./image (1).png" alt="Min Temp" width="30px">
                    <div>
                        <h6 class="metric-title m-0">Min Temp</h6>
                        <h6 class="metric-val m-0" id="temp_min">- &deg;C</h6>
                    </div>
                </div>
            </div>

            <!-- Row 2: AQI and Sunrise/Sunset -->
            <div class="rightRow rowTwo">
                <!-- Air Quality Index -->
                <div class="AQI rowTwoDiv p-3 d-flex flex-column justify-content-between">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5 class="m-0 fw-bold">Air Quality Index (AQI)</h5>
                        <span id="aqiBadge" class="badge aqiBadge">Good</span>
                    </div>
                    <div class="d-flex align-items-center justify-content-between pt-2">
                        <img src="./wind.png" alt="Air flow icon" width="40px">
                        <div class="text-center">
                            <h6 class="m-0 text-white-50 small">PM2.5</h6>
                            <h6 class="m-0 fw-bold" id="pm2_5Value">0</h6>
                        </div>
                        <div class="text-center">
                            <h6 class="m-0 text-white-50 small">PM10</h6>
                            <h6 class="m-0 fw-bold" id="pm10Value">0</h6>
                        </div>
                        <div class="text-center">
                            <h6 class="m-0 text-white-50 small">NO2</h6>
                            <h6 class="m-0 fw-bold" id="no2Value">0</h6>
                        </div>
                        <div class="text-center">
                            <h6 class="m-0 text-white-50 small">O3</h6>
                            <h6 class="m-0 fw-bold" id="o3Value">0</h6>
                        </div>
                        <div class="text-center">
                            <h6 class="m-0 text-white-50 small">SO2</h6>
                            <h6 class="m-0 fw-bold" id="so2Value">0</h6>
                        </div>
                    </div>
                </div>

                <!-- Sunrise & Sunset -->
                <div class="sunRise rowTwoDiv p-3 d-flex flex-column justify-content-between">
                    <h5 class="m-0 fw-bold">Sunrise & Sunset</h5>
                    <div class="d-flex justify-content-around align-items-center pt-2">
                        <div class="sunriseDiv d-flex gap-2 align-items-center">
                            <img src="./sun (1).png" alt="Sunrise" width="52px">
                            <div class="d-flex flex-column">
                                <h6 class="m-0 text-white-50 small">Sunrise</h6>
                                <h5 class="m-0 fw-bold" id="riseTime">-:-- AM</h5>
                            </div>
                        </div>
                        <div class="sunsetDiv d-flex gap-2 align-items-center">
                            <img src="./moon.png" alt="Sunset" width="48px">
                            <div class="d-flex flex-column">
                                <h6 class="m-0 text-white-50 small">Sunset</h6>
                                <h5 class="m-0 fw-bold" id="setTime">-:-- PM</h5>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Row 3: Hourly Forecast -->
            <div class="rightRow rowThree d-flex flex-column gap-2">
                <h5 class="m-0 fw-bold">Upcoming Hourly Forecast</h5>
                <div class="d-flex todayTempParentDiv" id="todayTempContainer"></div>
            </div>
        </section>
    </main>

    <!-- Bootstrap Bundle JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <!-- Environment Config & Custom Script -->
    <script src="./env.js"></script>
    <script src="./script.js"></script>
</body>
</html>
